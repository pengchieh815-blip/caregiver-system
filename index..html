<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耕莘醫院 看護申請及派班系統</title>
<style>
  :root{
    --bg: #eef2f4;
    --panel: #ffffff;
    --ink: #1c2b33;
    --ink-soft: #5b6b73;
    --line: #dde4e7;
    --teal: #0f6674;
    --teal-deep: #0a4a54;
    --teal-soft: #e3f0f1;
    --amber: #c67c2e;
    --amber-soft: #fbf1e2;
    --green: #2f8a5b;
    --green-soft: #e6f4ec;
    --red: #b3432f;
    --red-soft: #fbeae6;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    line-height:1.5;
  }
  .app{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  header.top{
    display:flex;flex-direction:column;align-items:center;
    padding:18px 4px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  header.top h1{
    font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
    font-size:24px;margin:0 0 16px;letter-spacing:1px;font-weight:700;
    color:var(--teal-deep);text-align:center;width:100%;
  }
  header.top .eyebrow{
    font-size:11px;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:2px;
    text-align:center;
  }
  .back-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:7px 16px;border-radius:999px;font-size:13px;cursor:pointer;margin-top:2px;
  }
  .back-btn:hover{color:var(--teal-deep);border-color:var(--teal);}
  section.screen{display:none;}
  section.screen.active{display:block;}

  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px;}
  @media (max-width:720px){.menu-grid{grid-template-columns:1fr;}}
  .menu-card{
    border:none;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;
    transition:.15s;box-shadow:0 2px 10px rgba(20,40,50,.05);font-family:inherit;
  }
  .menu-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,40,50,.1);}
  .menu-card .mc-icon{font-size:32px;margin-bottom:10px;}
  .menu-card .mc-title{font-size:16px;font-weight:700;margin-bottom:6px;}
  .menu-card .mc-desc{font-size:12.5px;opacity:.85;line-height:1.5;}
  .mc-sky{background:#eaf4fb;color:#2f6b91;}
  .mc-lilac{background:#f2eefb;color:#6a4ba3;}
  .mc-peach{background:#fef2e6;color:#a8702e;}

  .gate-box{
    max-width:360px;margin:50px auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:32px 28px;text-align:center;
  }
  .gate-box h2{margin:0 0 6px;color:var(--teal-deep);font-size:18px;}
  .gate-box p{margin:0 0 18px;color:var(--ink-soft);font-size:13px;}
  .gate-box input[type=password]{margin-bottom:14px;text-align:center;letter-spacing:3px;}
  .gate-box .choice-group{justify-content:center;margin-bottom:6px;}
  .gate-error{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;}

  .rank-badge{
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;
    background:var(--teal-soft);color:var(--teal-deep);
  }

  .subtabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;border:1px solid var(--line);width:fit-content;margin-bottom:18px;}
  .subtabs button{
    border:none;background:transparent;padding:8px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.15s;font-family:inherit;
  }
  .subtabs button.active{background:var(--teal);color:#fff;}
  .sub-panel{display:none;}
  .sub-panel.active{display:block;}

  .status-card-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;
  }
  .status-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .status-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber);
  }
  .status-card.contacted::before{background:var(--green);}
  .status-card .sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .status-card .sc-unit{font-size:15px;font-weight:700;color:var(--teal-deep);}
  .status-card .sc-patient{font-size:13px;color:var(--ink);margin-top:2px;}
  .status-card .sc-meta{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.7;}
  .status-card .sc-meta b{color:var(--ink);font-weight:600;}
  .status-card .sc-wait{
    display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;
    padding:3px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber);
  }

  .card{
    background:var(--card-bg, var(--panel));
    border:1px solid var(--card-border, var(--line));
    border-radius:var(--radius);
    padding:20px 22px;margin-bottom:16px;
  }
  .card h2{
    font-size:13px;margin:0 0 16px;color:var(--card-accent-deep, var(--teal-deep));
    letter-spacing:1px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .card h2::before{content:"";width:4px;height:14px;background:var(--card-accent, var(--teal));border-radius:2px;display:inline-block;}

  /* 群組粉嫩配色 */
  .card.c-sky{      --card-bg:#eaf4fb; --card-border:#cfe6f5; --card-accent:#5b9bc9; --card-accent-deep:#2f6b91; }
  .card.c-blush{    --card-bg:#fdedf1; --card-border:#f7d6e0; --card-accent:#dd7fa0; --card-accent-deep:#a84d6c; }
  .card.c-mint{     --card-bg:#e9f8f0; --card-border:#cdeeda; --card-accent:#5cb686; --card-accent-deep:#2e7a53; }
  .card.c-lilac{    --card-bg:#f2eefb; --card-border:#e0d6f5; --card-accent:#9b7fd6; --card-accent-deep:#6a4ba3; }
  .card.c-peach{    --card-bg:#fef2e6; --card-border:#fbe0c2; --card-accent:#e0a05a; --card-accent-deep:#a8702e; }

  .card.c-sky input:focus, .card.c-sky select:focus{outline-color:var(--card-accent);border-color:var(--card-accent);}
  .card.c-blush input:focus, .card.c-blush select:focus{outline-color:var(--card-accent);border-color:var(--card-accent);}
  .card.c-mint input:focus, .card.c-mint select:focus{outline-color:var(--card-accent);border-color:var(--card-accent);}
  .card.c-lilac input:focus, .card.c-lilac select:focus{outline-color:var(--card-accent);border-color:var(--card-accent);}
  .card.c-peach input:focus, .card.c-peach select:focus{outline-color:var(--card-accent);border-color:var(--card-accent);}

  .card .choice-group label{background:#fff;}
  .card.c-sky .choice-group label:has(input:checked){border-color:var(--card-accent);background:#dcedf9;color:var(--card-accent-deep);}
  .card.c-blush .choice-group label:has(input:checked){border-color:var(--card-accent);background:#fbdde7;color:var(--card-accent-deep);}
  .card.c-mint .choice-group label:has(input:checked){border-color:var(--card-accent);background:#d6f2e3;color:var(--card-accent-deep);}
  .card.c-lilac .choice-group label:has(input:checked){border-color:var(--card-accent);background:#e5d9f8;color:var(--card-accent-deep);}
  .card.c-peach .choice-group label:has(input:checked){border-color:var(--card-accent);background:#fbe4c4;color:var(--card-accent-deep);}

  .card .conditional{background:rgba(255,255,255,.6);border-left-color:var(--card-accent, var(--teal));}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.row{grid-template-columns:1fr;}}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  label.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  input[type=text], input[type=number], input[type=date], input[type=time], select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;background:#fcfdfd;color:var(--ink);font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .choice-group{display:flex;flex-wrap:wrap;gap:8px;}
  .choice-group label{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;
    font-size:13.5px;cursor:pointer;background:#fcfdfd;user-select:none;
  }
  .choice-group input{accent-color:var(--teal);width:15px;height:15px;flex:none;}
  .choice-group label:has(input:checked){border-color:var(--teal);background:var(--teal-soft);color:var(--teal-deep);font-weight:600;}
  .required::after{content:" *";color:var(--red);}

  .conditional{
    margin-top:10px;padding:12px;border-left:3px solid var(--teal);background:var(--teal-soft);border-radius:0 8px 8px 0;
    display:none;
  }
  .conditional.show{display:block;}

  .submit-row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  button.primary{
    background:var(--teal);color:#fff;border:none;padding:12px 26px;border-radius:8px;
    font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;
  }
  button.primary:hover{background:var(--teal-deep);}
  button.ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:12px 18px;border-radius:8px;font-size:14px;cursor:pointer;
  }
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep);color:#fff;padding:12px 22px;border-radius:8px;
    font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.18);
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* records */
  .records-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .records-toolbar select, .records-toolbar input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
  .record{
    background:#fbfaff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:12px;
  }
  .record-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .record-title{font-size:15px;font-weight:700;color:var(--teal-deep);}
  .record-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .badge.pending{background:var(--amber-soft);color:var(--amber);}
  .badge.done{background:var(--green-soft);color:var(--green);}
  .record-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:8px 16px;margin-top:12px;font-size:13px;
  }
  .record-grid .k{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;}
  .record-grid .v{font-weight:600;margin-top:1px;}
  .record-actions{margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .record-actions button{
    font-size:12.5px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--ink-soft);
  }
  .record-actions button.copy-btn{border-color:var(--teal);color:var(--teal-deep);font-weight:700;background:var(--teal-soft);}
  .record-actions button.send-btn{border-color:var(--teal-deep);color:#fff;font-weight:700;background:var(--teal);}
  .record-actions button.send-btn:hover{background:var(--teal-deep);}
  .record-actions button.del-btn{border-color:var(--red);color:var(--red);}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 10px;font-size:14px;}
  .shared-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px;padding:10px 12px;background:var(--amber-soft);border-radius:8px;}

  .badge.contacted{background:var(--green-soft);color:var(--green);}

  .dispatch-block{
    margin-top:14px;padding:14px;border-radius:8px;background:#f6eefb;border:1px solid #e6d7f5;
  }
  .dispatch-block .dispatch-title{
    font-size:11.5px;font-weight:700;color:#6a4ba3;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
  }
  .dispatch-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
  @media (max-width:640px){.dispatch-row{grid-template-columns:1fr 1fr;}}
  .dispatch-row .pri-field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
  .dispatch-row select{width:100%;padding:7px 8px;border:1px solid #e0cdf2;border-radius:7px;font-size:13px;background:#fff;}
  .status-field{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap;}
  .status-field label{font-size:11px;color:var(--ink-soft);}
  .status-field select{padding:7px 10px;border:1px solid #e0cdf2;border-radius:7px;font-size:13px;background:#fff;}
  .summary-box{
    margin-top:10px;width:100%;min-height:120px;border:1px solid #e0cdf2;border-radius:7px;
    padding:10px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
    background:#fff;color:var(--ink);resize:vertical;white-space:pre-wrap;display:none;
  }
  .summary-box.show{display:block;}

  .agency-status-block{
    margin-top:14px;padding:14px;border-radius:8px;background:#fdf1e4;border:1px solid #fbdfb8;
  }
  .agency-status-block .dispatch-title{
    font-size:11.5px;font-weight:700;color:#a8702e;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
  }
  .agency-status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:640px){.agency-status-row{grid-template-columns:1fr;}}
  .agency-status-row .pri-field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
  .agency-status-row select, .agency-status-row input{
    width:100%;padding:7px 8px;border:1px solid #f0cf9c;border-radius:7px;font-size:13px;background:#fff;
  }

  .agency-progress-note{
    margin-top:12px;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.8;
    background:#f6f2ea;border:1px solid #e6ddc9;color:var(--ink);
  }
  .agency-progress-note.searching{background:var(--amber-soft);border-color:#f0d9ad;}
  .agency-progress-note.assigned{background:var(--green-soft);border-color:#bfe3cd;}
  .agency-progress-note .apn-label{font-weight:700;color:var(--ink-soft);margin-right:4px;}
  .agency-progress-note .apn-status{font-weight:700;margin-right:10px;}
  .agency-progress-note .apn-item{margin-right:12px;color:var(--ink-soft);}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    authDomain: "caregiver-system-565b5.firebaseapp.com",

    storageBucket: "caregiver-system-565b5.firebasestorage.app",

  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const APPLICATIONS_COL = 'applications';
</script>
<div class="app">

  <header class="top">
    <div class="eyebrow">護理部 · 個案照護支援</div>
    <h1>耕莘醫院 看護申請及派班系統</h1>
    <button id="backBtn" class="back-btn" style="display:none;" onclick="showScreen('Menu')">← 返回主選單</button>
  </header>

  <!-- ===================== MAIN MENU ===================== -->
  <section id="screenMenu" class="screen active">
    <div class="menu-grid">
      <button type="button" class="menu-card mc-sky" onclick="showScreen('Form')">
        <div class="mc-icon">🏥</div>
        <div class="mc-title">護理單位申請</div>
        <div class="mc-desc">各單位護理師填寫看護申請需求</div>
      </button>
      <button type="button" class="menu-card mc-lilac" onclick="enterDispatch()">
        <div class="mc-icon">🗂️</div>
        <div class="mc-title">護理部派班管理</div>
        <div class="mc-desc">安排聯繫順位、追蹤派案狀態（需輸入密碼）</div>
      </button>
      <button type="button" class="menu-card mc-peach" onclick="enterAgencyGate()">
        <div class="mc-icon">🤝</div>
        <div class="mc-title">照服社</div>
        <div class="mc-desc">侒侒／順心／同心圓／匯鑫查看指派給貴公司的需求</div>
      </button>
    </div>
  </section>

  <!-- ===================== FORM ===================== -->
  <section id="screenForm" class="screen">

    <div class="subtabs">
      <button type="button" id="subTabApply" class="active" onclick="switchFormSub('apply')">新增申請</button>
      <button type="button" id="subTabStatus" onclick="switchFormSub('status')">派班進度查詢</button>
    </div>

    <div id="formSubApply" class="sub-panel active">
    <form id="applyForm">

      <div class="card c-sky">
        <h2>申請單位與人員</h2>
        <div class="row">
          <div class="field">
            <label class="field-label required">單位</label>
            <select name="unit" required>
              <option value="">請選擇</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label required">申請人姓名（護理師）</label>
            <input type="text" name="applicantName" placeholder="請輸入全名" required>
          </div>
        </div>
      </div>

      <div class="card c-blush">
        <h2>病人基本資料</h2>
        <div class="row">
          <div class="field">
            <label class="field-label required">病人姓名</label>
            <input type="text" name="patientName" required>
          </div>
          <div class="field">
            <label class="field-label required">年齡</label>
            <input type="number" name="age" min="0" max="150" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label class="field-label required">病人目前所屬床號</label>
            <input type="text" name="currentBed" placeholder="單位+床號，例：4A123" required>
            <div class="hint">ER 病人請於下方備註欄填寫病歷號碼</div>
          </div>
          <div class="field" id="erNoteField" style="display:none;">
            <label class="field-label">病歷號碼（ER 病人）</label>
            <input type="text" name="erChartNo" placeholder="請輸入病歷號碼">
          </div>
        </div>

        <div class="field">
          <label class="field-label required">預計轉出或入住的單位及床號</label>
          <div class="choice-group">
            <label><input type="radio" name="transferOption" value="同上" required> 同上</label>
            <label><input type="radio" name="transferOption" value="手輸入"> 手輸入</label>
          </div>
          <div class="conditional" id="transferManualBox">
            <input type="text" name="transferBedManual" placeholder="請輸入預計轉出或入住的單位及床號">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label required">病人性別</label>
            <div class="choice-group">
              <label><input type="radio" name="gender" value="男" required> 男</label>
              <label><input type="radio" name="gender" value="女"> 女</label>
            </div>
          </div>
          <div class="field">
            <label class="field-label required">病人身份</label>
            <select name="identity" required>
              <option value="">請選擇</option>
              <option>員工</option>
              <option>神職人員</option>
              <option>北區老人</option>
              <option>一般</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label required">病人意識狀況</label>
          <select name="consciousness" required>
            <option value="">請選擇</option>
            <option>清楚</option>
            <option>不清楚</option>
            <option>混亂</option>
          </select>
        </div>
      </div>

      <div class="card c-mint">
        <h2>病人狀況（可複選）</h2>

        <div class="field">

<script>
const UNITS = ["4A","9A","13E","12E","11E","10E","8E","7E","6E","MI-1","MI-2","SICU","CCU","PI","ER"];
const unitSelect = document.querySelector('select[name="unit"]');
const filterUnit = document.getElementById('filterUnit');
const statusFilterUnit = document.getElementById('statusFilterUnit');
UNITS.forEach(u=>{
  const o1=document.createElement('option'); o1.value=u; o1.textContent=u; unitSelect.appendChild(o1);
  const o2=document.createElement('option'); o2.value=u; o2.textContent=u; filterUnit.appendChild(o2);
  const o3=document.createElement('option'); o3.value=u; o3.textContent=u; statusFilterUnit.appendChild(o3);
});

function switchFormSub(tab){
  document.getElementById('formSubApply').classList.toggle('active', tab==='apply');
  document.getElementById('formSubStatus').classList.toggle('active', tab==='status');
  document.getElementById('subTabApply').classList.toggle('active', tab==='apply');
  document.getElementById('subTabStatus').classList.toggle('active', tab==='status');
  if(tab==='status') loadStatusBoard();
}
statusFilterUnit.addEventListener('change', loadStatusBoard);

const DISPATCH_PASSWORD = '2000';
let dispatchUnlocked = false;
let currentAgency = null;
const CACHE = {}; // key -> application data, shared across dispatch & agency views

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+name).classList.add('active');
  document.getElementById('backBtn').style.display = name==='Menu' ? 'none' : 'inline-block';
}

function enterDispatch(){
  if(dispatchUnlocked){
    showScreen('Dispatch');
    loadRecords();
  } else {
    showScreen('DispatchGate');
    const pw = document.getElementById('dispatchPassword');
    pw.value = '';
    document.getElementById('dispatchPasswordError').textContent = '';
    setTimeout(()=>pw.focus(), 50);
  }
}

function checkDispatchPassword(){
  const val = document.getElementById('dispatchPassword').value;
  if(val === DISPATCH_PASSWORD){
    dispatchUnlocked = true;
    showScreen('Dispatch');
    loadRecords();
  } else {
    document.getElementById('dispatchPasswordError').textContent = '密碼錯誤，請再試一次';
  }
}

const AGENCY_PASSWORDS = {
  '侒侒': 'NS2001',
  '順心': 'NS2003',
  '匯鑫': 'NS2005',
  '同心圓': 'NS2007',
};

function enterAgencyGate(){
  document.querySelectorAll('input[name="agencyPick"]').forEach(r=>r.checked=false);
  document.getElementById('agencyPassword').value = '';
  document.getElementById('agencyPickError').textContent = '';
  showScreen('AgencyGate');
}

function enterAgency(){
  const picked = document.querySelector('input[name="agencyPick"]:checked');
  const pwInput = document.getElementById('agencyPassword');
  const errBox = document.getElementById('agencyPickError');
  if(!picked){
    errBox.textContent = '請先選擇貴公司';
    return;
  }
  const company = picked.value;
  const pw = pwInput.value;
  if(pw !== AGENCY_PASSWORDS[company]){
    errBox.textContent = '密碼錯誤，請再試一次';
    pwInput.value = '';
    pwInput.focus();
    return;
  }
  currentAgency = company;
  errBox.textContent = '';
  pwInput.value = '';
  document.getElementById('agencyNote').textContent =
    `目前檢視公司：${currentAgency}（僅顯示已將貴公司列入聯繫順位的案件，不會顯示其他公司的順位資訊）`;
  showScreen('Agency');
  loadAgencyRecords();
}

// ER note toggle
unitSelect.addEventListener('change', ()=>{
  document.getElementById('erNoteField').style.display = unitSelect.value === 'ER' ? 'block' : 'none';
});

// transfer option conditional
document.querySelectorAll('input[name="transferOption"]').forEach(r=>{
  r.addEventListener('change', ()=>{
    document.getElementById('transferManualBox').classList.toggle('show', r.value==='手輸入' && r.checked);
  });
});

// social case conditional
document.querySelectorAll('input[name="socialCase"]').forEach(r=>{
  r.addEventListener('change', ()=>{
    document.getElementById('socialCaseBox').classList.toggle('show', r.value==='是' && r.checked);
  });
});

// checkbox groups: "其他" toggles text box; also make selections mutually clear when "無"/"無管路" chosen
document.querySelectorAll('.other-toggle').forEach(cb=>{
  cb.addEventListener('change', ()=>{
    document.getElementById(cb.dataset.target).classList.toggle('show', cb.checked);
  });
});
document.querySelectorAll('.choice-group[data-group]').forEach(group=>{
  const noneValues = ["無","無管路"];
  group.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(noneValues.includes(cb.value) && cb.checked){
        group.querySelectorAll('input[type=checkbox]').forEach(other=>{
          if(other!==cb){ other.checked=false; if(other.classList.contains('other-toggle')){ document.getElementById(other.dataset.target).classList.remove('show'); } }
        });
      } else if(cb.checked){
        group.querySelectorAll('input[type=checkbox]').forEach(other=>{
          if(noneValues.includes(other.value)) other.checked=false;
        });
      }
    });
  });
});

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function resetForm(){
  document.getElementById('applyForm').reset();
  document.querySelectorAll('.conditional').forEach(c=>c.classList.remove('show'));
  document.getElementById('erNoteField').style.display='none';
}

document.getElementById('applyForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);

  const getMulti = (name)=> fd.getAll(name);

  const data = {
    unit: fd.get('unit'),
    applicantName: fd.get('applicantName')?.trim(),
    patientName: fd.get('patientName')?.trim(),
    age: fd.get('age'),
    currentBed: fd.get('currentBed')?.trim(),
    erChartNo: fd.get('erChartNo')?.trim() || '',
    transferOption: fd.get('transferOption'),
    transferBedManual: fd.get('transferBedManual')?.trim() || '',
    gender: fd.get('gender'),
    identity: fd.get('identity'),
    consciousness: fd.get('consciousness'),
    specialAlerts: getMulti('specialAlerts'),
    specialAlertsOther: fd.get('specialAlertsOther')?.trim() || '',
    tubes: getMulti('tubes'),
    tubesOther: fd.get('tubesOther')?.trim() || '',
    specialNeeds: getMulti('specialNeeds'),
    specialNeedsOther: fd.get('specialNeedsOther')?.trim() || '',
    restraint: fd.get('restraint'),
    isolation: getMulti('isolation'),
    isolationOther: fd.get('isolationOther')?.trim() || '',
    socialCase: fd.get('socialCase'),
    socialWorkerName: fd.get('socialWorkerName')?.trim() || '',
    socialWorkerPhone: fd.get('socialWorkerPhone')?.trim() || '',
    caregiverGender: fd.get('caregiverGender'),
    caregiverLanguage: fd.get('caregiverLanguage'),
    shiftType: fd.get('shiftType'),
    startDate: fd.get('startDate'),
    startTime: fd.get('startTime'),
    status: 'pending',
    createdAt: new Date().toISOString(),
  };

  if(data.transferOption === '同上'){ data.transferBedFinal = data.currentBed; }
  else { data.transferBedFinal = data.transferBedManual; }

  const id = 'app_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  try{
    await db.collection(APPLICATIONS_COL).doc(id).set(data);
    showToast('申請已送出');
    resetForm();
  }catch(err){
    console.error(err);
    showToast('送出失敗：' + err.message);
  }
});

async function loadRecords(){
  const wrap = document.getElementById('recordsWrap');
  wrap.innerHTML = '<div class="empty">載入中…</div>';
  try{
    const snapshot = await db.collection(APPLICATIONS_COL).get();
    if(snapshot.empty){
      wrap.innerHTML = '<div class="empty">目前沒有申請紀錄</div>';
      ALL_ITEMS = [];
      return;
    }
    const items = [];
    snapshot.forEach(doc=>{
      const data = doc.data();
      CACHE[doc.id] = data;
      items.push({key: doc.id, data});
    });
    items.sort((a,b)=> (b.data.createdAt||'').localeCompare(a.data.createdAt||''));
    renderRecords(items);
  }catch(err){
    console.error(err);
    wrap.innerHTML = '<div class="empty">載入失敗：' + err.message + '</div>';
  }
}

let ALL_ITEMS = [];

function renderRecords(items){
  ALL_ITEMS = items;
  applyFilters();
}

function applyFilters(){
  const unit = document.getElementById('filterUnit').value;
  const status = document.getElementById('filterStatus').value;
  const filtered = ALL_ITEMS.filter(it=>{
    if(unit && it.data.unit !== unit) return false;
    if(status && (it.data.dispatchStatus || 'pending') !== status) return false;
    return true;
  });
  const wrap = document.getElementById('recordsWrap');
  if(filtered.length===0){
    wrap.innerHTML = '<div class="empty">沒有符合條件的申請紀錄</div>';
    return;
  }
  wrap.innerHTML = filtered.map(it=>{
    const d = it.data;
    const dispatchStatus = d.dispatchStatus || 'pending';
    const statusBadge = dispatchStatus==='contacted'
      ? '<span class="badge contacted">已聯絡看護公司</span>'
      : '<span class="badge pending">待處理</span>';
    const created = d.createdAt ? new Date(d.createdAt).toLocaleString('zh-TW') : '';
    const alerts = (d.specialAlerts||[]).filter(v=>v!=='其他').concat(d.specialAlertsOther?[d.specialAlertsOther]:[]);
    const tubes = (d.tubes||[]).filter(v=>v!=='其他').concat(d.tubesOther?[d.tubesOther]:[]);
    const needs = (d.specialNeeds||[]).filter(v=>v!=='其他').concat(d.specialNeedsOther?[d.specialNeedsOther]:[]);
    const isolation = (d.isolation||[]).filter(v=>v!=='其他').concat(d.isolationOther?[d.isolationOther]:[]);

    const priOptions = (current)=> ['<option value="">未選擇</option>']
      .concat(COMPANIES.map(c=>`<option value="${c}"${current===c?' selected':''}>${c}</option>`)).join('');

    return `
      <div class="record">
        <div class="record-head">
          <div>
            <div class="record-title">${escapeHtml(d.unit||'')} ・ ${escapeHtml(d.patientName||'')}（${escapeHtml(String(d.age||''))}歲）</div>
            <div class="record-sub">申請人：${escapeHtml(d.applicantName||'')} ・ 送出時間：${escapeHtml(created)}</div>
          </div>
          ${statusBadge}
        </div>
        <div class="record-grid">
          <div><div class="k">床號</div><div class="v">${escapeHtml(d.currentBed||'')}${d.erChartNo?'（病歷號：'+escapeHtml(d.erChartNo)+'）':''}</div></div>
          <div><div class="k">轉出/入住</div><div class="v">${escapeHtml(d.transferBedFinal||'—')}</div></div>
          <div><div class="k">性別</div><div class="v">${escapeHtml(d.gender||'')}</div></div>
          <div><div class="k">身份</div><div class="v">${escapeHtml(d.identity||'')}</div></div>
          <div><div class="k">意識狀況</div><div class="v">${escapeHtml(d.consciousness||'')}</div></div>
          <div><div class="k">約束</div><div class="v">${escapeHtml(d.restraint||'')}</div></div>
          <div><div class="k">特殊提醒</div><div class="v">${escapeHtml(alerts.join('、')||'無')}</div></div>
          <div><div class="k">管路</div><div class="v">${escapeHtml(tubes.join('、')||'無管路')}</div></div>
          <div><div class="k">特殊需求</div><div class="v">${escapeHtml(needs.join('、')||'—')}</div></div>
          <div><div class="k">隔離/感染</div><div class="v">${escapeHtml(isolation.join('、')||'無')}</div></div>
          <div><div class="k">社服個案</div><div class="v">${escapeHtml(d.socialCase||'')}${d.socialCase==='是'?'（'+escapeHtml(d.socialWorkerName||'')+' '+escapeHtml(d.socialWorkerPhone||'')+'）':''}</div></div>
          <div><div class="k">看護需求</div><div class="v">${escapeHtml(d.caregiverGender||'')}／${escapeHtml(d.caregiverLanguage||'')}／${escapeHtml(d.shiftType||'')}</div></div>
          <div><div class="k">預計開始</div><div class="v">${escapeHtml(d.startDate||'')} ${escapeHtml(d.startTime||'')}</div></div>
        </div>

        <div class="dispatch-block">
          <div class="dispatch-title">派案 ・ 聯繫看護公司</div>
          <div class="dispatch-row">
            <div class="pri-field">
              <label>第一順位</label>
              <select onchange="updateDispatch('${it.key}','contactPriority1',this.value)">${priOptions(d.contactPriority1||'')}</select>
            </div>
            <div class="pri-field">
              <label>第二順位</label>
              <select onchange="updateDispatch('${it.key}','contactPriority2',this.value)">${priOptions(d.contactPriority2||'')}</select>
            </div>
            <div class="pri-field">

            <label>狀態</label>

              <option value="contacted"${dispatchStatus==='contacted'?' selected':''}>已聯絡看護公司</option>
            </select>

          <textarea class="summary-box" id="summary-${it.key}" readonly></textarea>

        ${agencyProgressHtml(d)}

        <div class="record-actions">
          <button class="send-btn" onclick="dispatchToFirstPriority('${it.key}')">${d.contactPriority1 ? '送出給第一順位（'+escapeHtml(d.contactPriority1)+'）' : '送出給第一順位'}</button>
          <button class="copy-btn" onclick="copySummary('${it.key}')">複製需求整理文字</button>
          <button class="del-btn" onclick="deleteRecord('${it.key}')">刪除</button>
        </div>
      </div>
    `;
  }).join('');
}

const COMPANIES = ["順心","侒侒","匯鑫","同心圓"];

function buildSummaryText(d, opts={}){
  const alerts = (d.specialAlerts||[]).filter(v=>v!=='其他').concat(d.specialAlertsOther?[d.specialAlertsOther]:[]);
  const tubes = (d.tubes||[]).filter(v=>v!=='其他').concat(d.tubesOther?[d.tubesOther]:[]);
  const needs = (d.specialNeeds||[]).filter(v=>v!=='其他').concat(d.specialNeedsOther?[d.specialNeedsOther]:[]);
  const isolation = (d.isolation||[]).filter(v=>v!=='其他').concat(d.isolationOther?[d.isolationOther]:[]);
  const priorities = [d.contactPriority1, d.contactPriority2, d.contactPriority3, d.contactPriority4]
    .map((c,i)=> c ? `${i+1}. ${c}` : null).filter(Boolean).join('　');

  const lines = [
    '【看護需求整理】',
    `單位／床號：${d.unit||''} ${d.currentBed||''}${d.erChartNo?'（病歷號：'+d.erChartNo+'）':''}`,
    `轉出/入住：${d.transferBedFinal||'—'}`,
    `病人：${d.patientName||''}（${d.age||''}歲・${d.gender||''}）`,
    `身份：${d.identity||''}　意識狀況：${d.consciousness||''}　約束：${d.restraint||''}`,
    `特殊提醒：${alerts.join('、')||'無'}`,
    `管路：${tubes.join('、')||'無管路'}`,
    `特殊需求：${needs.join('、')||'—'}`,
    `隔離/感染：${isolation.join('、')||'無'}`,
    `看護需求：${d.caregiverGender||''}／${d.caregiverLanguage||''}／${d.shiftType||''}`,
    `預計開始：${d.startDate||''} ${d.startTime||''}`,
    `申請人（護理師）：${d.applicantName||''}`,
  ];
  if(d.socialCase==='是'){
    lines.push(`社服個案：是（${d.socialWorkerName||''} ${d.socialWorkerPhone||''}）`);
  }
  if(priorities && !opts.hidePriorities){
    lines.push(`聯繫順位：${priorities}`);
  }
  return lines.join('\n');
}

async function copySummary(key, boxPrefix='summary', opts={}){
  const data = CACHE[key];
  if(!data) return;
  const text = buildSummaryText(data, opts);
  const box = document.getElementById(boxPrefix+'-'+key);
  if(box){
    box.value = text;
    box.classList.add('show');
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('已複製需求文字，可直接貼給看護社');
  }catch(err){
    if(box){
      box.focus();
      box.select();
      try{ document.execCommand('copy'); showToast('已複製需求文字，可直接貼給看護社'); }
      catch(e2){ showToast('自動複製失敗，請手動選取下方文字複製'); }
    }
  }
}

async function dispatchToFirstPriority(key){
  const data = CACHE[key];
  if(!data) return;
  if(!data.contactPriority1){
    showToast('請先選擇第一順位的看護公司');
    return;
  }
  const companyName = data.contactPriority1;
  const text = buildSummaryText(data, {hidePriorities:true});
  const box = document.getElementById('summary-'+key);
  if(box){
    box.value = text;
    box.classList.add('show');
  }
  let copied = false;
  try{
    await navigator.clipboard.writeText(text);
    copied = true;
  }catch(err){
    if(box){
      box.focus();
      box.select();
      try{ document.execCommand('copy'); copied = true; } catch(e2){ /* fallback below */ }
    }
  }
  // 自動標記為已聯絡看護公司
  data.dispatchStatus = 'contacted';
  try{
    await db.collection(APPLICATIONS_COL).doc(key).update({dispatchStatus: 'contacted'});
  }catch(err){
    showToast('狀態更新失敗：'+err.message);
    return;
  }
  const item = ALL_ITEMS.find(it=>it.key===key);
  if(item){ item.data.dispatchStatus = 'contacted'; }
  applyFilters();
  showToast(copied
    ? `已複製需求文字給「${companyName}」，並標記為已聯絡看護公司`
    : `已標記為已聯絡看護公司，但自動複製失敗，請手動選取下方文字複製給「${companyName}」`);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function formatArrivalTime(val){
  if(!val) return '';
  const dt = new Date(val);
  return isNaN(dt.getTime()) ? val : dt.toLocaleString('zh-TW');
}

// 產生「看護公司回報進度」的唯讀顯示區塊（派案管理、護理單位查詢頁共用）
function agencyProgressHtml(d){
  const status = d.agencyStatus || '';
  const name = d.caregiverName || '';
  const arrival = d.caregiverArrivalTime || '';
  if(!status && !name && !arrival) return '';
  const statusClass = status==='派班' ? 'assigned' : (status==='尋覓看護' ? 'searching' : '');
  return `
    <div class="agency-progress-note ${statusClass}">
      <span class="apn-label">看護公司回報：</span>
      ${status ? `<span class="apn-status">${escapeHtml(status)}</span>` : ''}
      ${name ? `<span class="apn-item">看護：${escapeHtml(name)}</span>` : ''}
      ${arrival ? `<span class="apn-item">到院時間：${escapeHtml(formatArrivalTime(arrival))}</span>` : ''}
    </div>
  `;
}

async function updateDispatch(key, field, value){
  const item = ALL_ITEMS.find(it=>it.key===key);
  if(!item) return;
  item.data[field] = value;
  try{
    await db.collection(APPLICATIONS_COL).doc(key).update({[field]: value});
    applyFilters();
    if(field==='dispatchStatus'){
      showToast(value==='contacted' ? '已標記為已聯絡看護公司' : '已改回待處理');
    }
  }catch(err){ showToast('更新失敗：'+err.message); }
}

async function deleteRecord(key){
  if(!confirm('確定要刪除這筆申請紀錄嗎？此動作無法復原。')) return;
  try{
    await db.collection(APPLICATIONS_COL).doc(key).delete();
    ALL_ITEMS = ALL_ITEMS.filter(it=>it.key!==key);
    delete CACHE[key];
    applyFilters();
    showToast('已刪除');
  }catch(err){ showToast('刪除失敗：'+err.message); }
}

document.getElementById('filterUnit').addEventListener('change', applyFilters);
document.getElementById('filterStatus').addEventListener('change', applyFilters);

// 照服社更新看護派案進度（狀態／看護姓名／到院時間）— 會直接寫入同一份資料，
// 派案管理與護理單位的畫面重新整理後即可看到最新狀態
async function updateAgencyField(key, field, value){
  const item = AGENCY_ITEMS.find(it=>it.key===key);
  if(!item) return;
  item.data[field] = value;
  if(CACHE[key]) CACHE[key][field] = value;
  try{
    await db.collection(APPLICATIONS_COL).doc(key).update({[field]: value});
    renderAgencyRecords(AGENCY_ITEMS);
    if(field==='agencyStatus'){
      showToast(value ? `已更新狀態為「${value}」` : '已改回尚未開始');
    } else if(field==='caregiverName'){
      showToast('已更新看護姓名');
    } else if(field==='caregiverArrivalTime'){
      showToast('已更新看護到院時間');
    }
  }catch(err){ showToast('更新失敗：'+err.message); }
}

// ===================== STATUS BOARD (護理單位查詢用) =====================
function formatWait(createdAt){
  if(!createdAt) return '';
  const ms = Date.now() - new Date(createdAt).getTime();
  const hrs = Math.floor(ms/3600000);
  if(hrs < 1) return '未滿 1 小時';
  if(hrs < 24) return `已等待 ${hrs} 小時`;
  const days = Math.floor(hrs/24);
  return `已等待 ${days} 天`;
}

async function loadStatusBoard(){
  const wrap = document.getElementById('statusBoardWrap');
  wrap.innerHTML = '<div class="empty">載入中…</div>';

    const snapshot = await db.collection(APPLICATIONS_COL).get();
    const unitFilter = statusFilterUnit.value;
    const items = [];

      const data = doc.data();
      CACHE[doc.id] = data;
      if(data.agencyStatus === '派班') return; // 已確定看護人選才算完成，從查詢清單移除
      if(unitFilter && data.unit !== unitFilter) return;
      items.push({key: doc.id, data});
    });
    items.sort((a,b)=> (a.data.createdAt||'').localeCompare(b.data.createdAt||'')); // 等待最久的排最前面
    renderStatusBoard(items);
  }catch(err){
    console.error(err);
    wrap.innerHTML = '<div class="empty">載入失敗：' + err.message + '</div>';
  }
}
